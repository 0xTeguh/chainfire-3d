<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHAINFIRE — 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a120c; font-family: Arial, Helvetica, sans-serif; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 10px; pointer-events: none; z-index: 5; gap: 8px; }
  .hud-left, .hud-mid, .hud-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .hud-mid { flex-direction: column; gap: 2px; }
  .hud-chip { background: rgba(20, 16, 10, 0.78); color: #f5e6c8; border: 1px solid rgba(255, 197, 61, 0.5); border-radius: 6px; padding: 4px 8px; font-size: 13px; font-weight: bold; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .hud-mult { background: rgba(20, 16, 10, 0.85); color: #ffc53d; border: 2px solid #ffc53d; border-radius: 8px; padding: 2px 14px; font-size: 30px; font-weight: 900; line-height: 1.1; }
  .hud-mult.mult-hot { color: #ff7a1a; border-color: #ff7a1a; }
  .hud-mult.mult-max { color: #fff; background: #e85d26; border-color: #ffd23f; text-shadow: 0 0 12px #ffd23f; }
  .hud-bar { width: 60px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; }
  .hud-bar-fill { height: 100%; background: #7ed957; width: 100%; }
  .hud-bar-fill.bar-low { background: #ff4d3d; }
  .hud-bar-powder { background: #ffb347; }
  .hud-fuse.fuse-armed { color: #ff7a1a; border-color: #ff7a1a; animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { opacity: 0.6; } }
  /* ROUND 3 (item 8) history: the bark first sat at fixed top:64px and
     overlapped the HUD chips, then hung just below the HUD. ROUND 4
     AGENT C (item 6) moved it to the bottom-left — see the .bark rule. */
  /* ROUND 4 AGENT C (item 6): the bark used to hang centered just below the
     HUD — mid-frame, over the trail and competing with the CHAIN x8!
     banner (and at 844px it overlapped the threat panel). Now it lives in
     #bottom and hangs just ABOVE the bar (bottom:100% of #bottom, so it
     tracks the bar's real height at every viewport — a fixed bottom:58px
     collided with the taller wrapped buttons at 844x390 / 390x844).
     Wren speaking from the fort, never over the action, never over a
     button. It stays inside the chrome (hides with it on screens). */
  .bark { position: absolute; bottom: calc(100% + 8px); left: 10px; max-width: min(420px, calc(100vw - 20px)); text-align: left; background: rgba(20,16,10,0.78); border: 1px solid rgba(255,197,61,0.5); border-radius: 6px; padding: 4px 10px; color: #ffe9a8; font-size: 15px; font-style: italic; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #bottom { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 10px; z-index: 5; gap: 8px; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  .powder-box { display: flex; gap: 6px; }
  /* ROUND 4 AGENT C (item 14): the powder buttons were static labels
     ("BLACK · 1 POWDER"). Now two lines — the powder name (with a ✓ when
     selected) over its real effect + cost (effect words come from data.js
     POWDER_TYPES.effect, real mechanics only). */
  .powder-btn { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; background: rgba(20,16,10,0.8); color: #f5e6c8; border: 2px solid var(--powder-color, #ffb347); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .powder-btn.active { background: var(--powder-color, #ffb347); color: #1a120c; }
  .powder-effect { font-size: 11px; font-weight: bold; opacity: 0.85; }
  .powder-btn.active .powder-effect { opacity: 1; }
  .light-btn { background: #e85d26; color: #fff; border: 2px solid #ffd23f; border-radius: 10px; padding: 12px 26px; font-size: 18px; font-weight: 900; cursor: pointer; opacity: 0.45; }
  .light-btn.light-ready { opacity: 1; animation: pulse 0.8s infinite; }
  .light-btn:disabled { cursor: default; }
  .ctl-box { display: flex; gap: 6px; }
  .ctl-btn { background: rgba(20,16,10,0.8); color: #f5e6c8; border: 1px solid rgba(255,197,61,0.5); border-radius: 6px; padding: 8px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
  /* ROUND 4 AGENT C (item 6): the bark moved to the bottom-left, so the
     toast no longer needs to hang below it — it sits directly under the
     HUD, centered, still tracking #hud height. It only shows on
     card-pick / wave-start (transient), and the popup placer now treats
     it as a DOM obstacle when visible. */
  #toast { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: rgba(20,16,10,0.85); color: #ffc53d; border: 1px solid #ffc53d; border-radius: 8px; padding: 8px 16px; font-size: 15px; font-weight: bold; opacity: 0; transition: opacity 0.2s; z-index: 6; pointer-events: none; }
  #toast.show { opacity: 1; }
  .screen { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 12px; }
  .screen:empty { display: none; }
  /* P1 (Rizal fix): panels were 65-70% of the frame — a dark wallpaper over
     the world. Title + results are now corner-clusters over the live scene:
     title top-left (max ~1/3 of the frame), results middle-left (~40% wide),
     both more translucent so the world shows through. Draft stays centered. */
  .screen-title { align-items: flex-start; justify-content: flex-start; padding: 20px 0 0 24px; }
  .screen-results { align-items: center; justify-content: flex-start; padding: 12px 0 12px 24px; }
  .title-wrap, .draft-wrap, .results-wrap, .help-wrap { background: rgba(18, 14, 8, 0.70); border: 2px solid rgba(255, 197, 61, 0.6); border-radius: 14px; padding: 14px 20px; max-width: 1020px; width: 100%; color: #f5e6c8; }
  .title-wrap { max-width: 600px; background: rgba(18, 14, 8, 0.62); }
  .results-wrap { max-width: 480px; background: rgba(18, 14, 8, 0.62); }
  .results-wrap .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .game-title { font-size: 44px; font-weight: 900; letter-spacing: 4px; color: #ffc53d; text-align: center; text-shadow: 0 0 24px rgba(255, 180, 60, 0.6), 0 3px 0 #7a4a00; line-height: 1; }
  .tagline { text-align: center; font-size: 15px; font-weight: bold; color: #ffe9a8; margin: 8px 0 12px; letter-spacing: 1px; }
  .goal-line { text-align: center; font-size: 13px; font-weight: 900; color: #ffe9a8; margin-bottom: 10px; letter-spacing: 0.5px; }
  .roster-line { font-size: 12px; line-height: 1.7; color: #c8b898; margin-bottom: 12px; text-align: center; }
  .roster-line .roster-group { color: #ffc53d; font-weight: 900; letter-spacing: 1px; }
  .roster-line .roster-name { font-weight: bold; color: #f5e6c8; }
  .chip-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .chip { background: rgba(255, 197, 61, 0.08); border: 1px solid rgba(255, 197, 61, 0.35); border-radius: 8px; padding: 8px 10px; }
  .chip-label { color: #ffc53d; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
  .chip-text { font-size: 13px; line-height: 1.35; margin-top: 2px; }
  .roster-strip { margin-bottom: 12px; }
  .roster-title { color: #ffc53d; font-size: 12px; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; }
  .roster-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .roster-item { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.06); border-radius: 20px; padding: 4px 10px 4px 6px; font-size: 12px; }
  .roster-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .roster-name { font-weight: bold; }
  .roster-role { color: #c8b898; }
  .how-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; font-size: 13px; }
  .how-step { background: rgba(255, 122, 26, 0.15); border: 1px solid rgba(255, 122, 26, 0.5); border-radius: 6px; padding: 5px 8px; font-weight: bold; }
  .how-arrow { color: #ffc53d; font-weight: bold; }
  .diff-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .diff-btn { background: rgba(255,255,255,0.07); color: #f5e6c8; border: 2px solid rgba(255,197,61,0.4); border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .diff-btn.active { background: #ffc53d; color: #1a120c; }
  .title-stats { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 13px; font-weight: bold; color: #ffe9a8; margin-bottom: 12px; }
  .play-btn { display: block; margin: 0 auto; background: #e85d26; color: #fff; border: 2px solid #ffd23f; border-radius: 10px; padding: 12px 48px; font-size: 22px; font-weight: 900; cursor: pointer; }
  .controls-line { text-align: center; font-size: 12px; color: #c8b898; margin-top: 12px; }
  .draft-title, .results-title, .help-title { font-size: 26px; font-weight: 900; color: #ffc53d; text-align: center; margin-bottom: 10px; }
  .draft-context { text-align: center; font-size: 13px; color: #ffe9a8; margin-bottom: 12px; }
  .card-row { display: flex; gap: 10px; justify-content: center; }
  .card { flex: 1; max-width: 300px; background: rgba(255,255,255,0.06); border: 2px solid #8a8a8a; border-radius: 10px; padding: 12px; color: #f5e6c8; cursor: pointer; text-align: left; position: relative; }
  .card.tier-rare { border-color: #4ac8ff; box-shadow: 0 0 14px rgba(74, 200, 255, 0.35); }
  .card.tier-epic { border-color: #c86aff; box-shadow: 0 0 14px rgba(200, 106, 255, 0.4); }
  .card.tier-common { border-color: #b8b0a0; }
  .card.unaffordable { opacity: 0.45; cursor: not-allowed; }
  .card-tier { font-size: 11px; font-weight: 900; letter-spacing: 1px; color: #ffc53d; }
  .card-new { position: absolute; top: 8px; right: 8px; background: #e85d26; color: #fff; font-size: 11px; font-weight: 900; border-radius: 4px; padding: 2px 6px; }
  .card-name { font-size: 18px; font-weight: 900; margin: 6px 0 4px; }
  .card-effect { font-size: 15px; font-weight: bold; color: #ffe9a8; }
  .card-synergy { font-size: 12px; color: #c8b898; margin-top: 6px; line-height: 1.4; }
  .card-cost { font-size: 13px; font-weight: 900; color: #ffc53d; margin-top: 8px; }
  .draft-actions { display: flex; gap: 10px; justify-content: center; margin: 14px 0 8px; }
  .draft-btn { background: rgba(255,255,255,0.08); color: #f5e6c8; border: 1px solid rgba(255,197,61,0.5); border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .draft-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .build-so-far { text-align: center; font-size: 13px; color: #c8b898; }
  .grade-row { display: flex; gap: 18px; align-items: center; justify-content: center; margin-bottom: 12px; }
  .grade-circle { width: 92px; height: 92px; border-radius: 50%; background: #ffc53d; color: #1a120c; font-size: 56px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 4px solid #fff2d8; }
  .score-num { font-size: 40px; font-weight: 900; color: #fff; }
  .score-label { font-size: 14px; font-weight: 900; color: #7ed957; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-cell { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 8px; text-align: center; }
  .stat-value { font-size: 18px; font-weight: 900; color: #fff; }
  .stat-label { font-size: 11px; color: #c8b898; letter-spacing: 1px; }
  .chart { margin-bottom: 12px; }
  .chart-title { font-size: 12px; font-weight: 900; color: #ffc53d; letter-spacing: 1px; margin-bottom: 4px; }
  .chart-bars { display: flex; gap: 4px; align-items: flex-end; height: 74px; }
  .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-fill { width: 100%; background: #ff7a1a; border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-num { font-size: 11px; font-weight: bold; color: #ffe9a8; }
  .chart-wave { font-size: 10px; color: #c8b898; }
  .feats-box, .last3-box, .build-box, .goal-box, .fors-box, .lifetime-box { margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
  .feats-title, .last3-title, .fors-title { font-size: 12px; font-weight: 900; color: #ffc53d; letter-spacing: 1px; }
  .feat.got { color: #7ed957; font-weight: bold; }
  .fors-item.met { color: #7ed957; }
  .results-actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .help-row { display: flex; gap: 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
  .help-key { min-width: 210px; font-weight: 900; color: #ffc53d; }
  /* ROUND 3 AGENT D — HUD additions (items 2, 3, 6, 7). */
  .hud-grade { background: #ffc53d; color: #1a120c; border-color: #fff2d8; }
  .hud-grade.grade-s { box-shadow: 0 0 10px rgba(255, 197, 61, 0.7); }
  .hud-chain { width: 100%; justify-content: center; font-size: 15px; }
  .chain-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
  .chain-progress-fill { height: 100%; background: #ffb347; width: 0%; }
  .chain-progress-fill.chain-progress-max { background: #ffd23f; box-shadow: 0 0 6px #ffd23f; }
  .boss-bar { width: 170px; background: rgba(40, 10, 8, 0.82); border: 1px solid rgba(255, 93, 38, 0.7); border-radius: 6px; padding: 3px 6px; color: #f5e6c8; }
  .boss-name { font-size: 11px; font-weight: 900; letter-spacing: 0.5px; color: #ffb347; }
  .boss-phase { color: #ff7a1a; font-size: 10px; font-weight: bold; white-space: nowrap; }
  .boss-bar-row { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .boss-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  .boss-bar-fill { height: 100%; background: #ff4d3d; width: 100%; }
  .boss-hp { font-size: 10px; font-weight: bold; white-space: nowrap; }
  /* ROUND 3 AGENT D — threat-queue panel (item 4) + event banner (item 1).
     Both live inside #hud, so they only show in play mode. The panel sits
     top-right below the HUD. ROUND 4 AGENT C (item 5) compacted it and
     (item 6) moved the bark to the bottom-left, so nothing meets it now. */
  /* ROUND 4 AGENT C (item 5): the threat panel was 290x126 (4 rows +
     title) — the tallest thing in the top-right, covering the Titan's
     zone and killing the wall-side camera (Agent A). QUEUED + NEXT are
     now one QUEUE row (ui.js), and the panel is tightened: padding
     6px→4px, line-height 1.55→1.4. Same info, ~1/3 shorter. It is NOT
     hidden — the queue is a selling point the judge should see. */
  .threat-panel { position: absolute; top: calc(100% + 8px); right: 10px; width: 290px; background: rgba(20, 16, 10, 0.82); border: 1px solid rgba(255, 197, 61, 0.5); border-radius: 8px; padding: 4px 8px; color: #f5e6c8; font-size: 12px; line-height: 1.4; pointer-events: none; }
  .threat-title { color: #ffc53d; font-size: 11px; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; }
  .threat-row { display: flex; gap: 8px; }
  .threat-label { min-width: 62px; color: #ffc53d; font-weight: 900; font-size: 11px; letter-spacing: 0.5px; flex-shrink: 0; }
  .threat-vals { font-weight: bold; }
  .threat-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 2px; }
  .event-banner { position: absolute; top: 38vh; left: 50%; transform: translateX(-50%); font-size: 56px; font-weight: 900; letter-spacing: 3px; color: #ffd23f; text-shadow: 0 0 18px rgba(255, 140, 30, 0.8), 0 3px 0 #7a4a00, 0 2px 8px rgba(0,0,0,0.8); white-space: nowrap; pointer-events: none; z-index: 7; }
  /* ROUND 3 AGENT D — title: how-to cards with diagrams (item 10) +
     THREAT → ANSWER roster (item 5). */
  .how-strip { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .how-card { flex: 1; background: rgba(255, 122, 26, 0.12); border: 1px solid rgba(255, 122, 26, 0.45); border-radius: 8px; padding: 6px 8px 7px; text-align: center; }
  .how-diagram { height: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
  .how-card-title { font-size: 12px; font-weight: 900; color: #ffc53d; letter-spacing: 0.5px; }
  .how-card-text { font-size: 11px; line-height: 1.3; color: #f5e6c8; margin-top: 1px; }
  .threat-table { margin-bottom: 10px; }
  .threat-table-title { color: #ffc53d; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-align: center; margin-bottom: 4px; }
  .threat-table-row { display: flex; align-items: baseline; gap: 6px; font-size: 12px; line-height: 1.55; }
  .threat-table-name { font-weight: 900; color: #f5e6c8; white-space: nowrap; }
  .threat-table-behavior { color: #c8b898; }
  .threat-table-arrow { color: #ffc53d; font-weight: 900; }
  .threat-table-answer { font-weight: bold; color: #ffe9a8; margin-left: auto; text-align: right; white-space: nowrap; }
  /* ROUND 3 AGENT D — draft: rarity-coloured tier text (item 9) +
     COMING NEXT strip. */
  .card.tier-common .card-tier { color: #b8b0a0; }
  .card.tier-rare .card-tier { color: #4ac8ff; }
  .card.tier-epic .card-tier { color: #c86aff; }
  .coming-next { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 13px; }
  .coming-next-title { color: #ffc53d; font-weight: 900; letter-spacing: 0.5px; }
  .coming-next-chip { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,197,61,0.35); border-radius: 20px; padding: 3px 10px; font-weight: bold; color: #f5e6c8; }
  .coming-next-boss { border-color: #e85d26; color: #ffb347; }
  /* ROUND 3 AGENT D — results: golden-hour gradient backdrop + NEW BEST
     badge (item 8). */
  .results-wrap { background: linear-gradient(160deg, rgba(74, 38, 10, 0.82), rgba(46, 22, 52, 0.78)); }
  .new-best-badge { background: #7ed957; color: #1a120c; border-radius: 4px; padding: 2px 8px; display: inline-block; }
  @media (max-width: 760px) {
    .game-title { font-size: 40px; }
    .chip-row { grid-template-columns: repeat(2, 1fr); }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .card-row { flex-direction: column; align-items: center; }
    .card { width: 100%; max-width: 420px; }
    .hud-chip { font-size: 11px; padding: 3px 6px; }
    .hud-mult { font-size: 22px; }
    .help-key { min-width: 130px; }
    /* ROUND 3 AGENT D: the threat panel has no room on a phone HUD — the
       bark + chips take the width; the panel returns at desktop widths. */
    .threat-panel { display: none; }
    .event-banner { font-size: 28px; letter-spacing: 1px; }
    .boss-bar { width: 140px; }
  }
  /* Results panel compaction (must fit 720px viewport; was 918px tall):
     these rules sit last so they win over the base rules above. */
  .results-wrap { padding: 10px 20px; }
  .results-title { font-size: 22px; margin-bottom: 6px; }
  .grade-row { margin-bottom: 8px; }
  .grade-circle { width: 64px; height: 64px; font-size: 40px; }
  .score-num { font-size: 30px; }
  .stat-grid { margin-bottom: 8px; }
  .stat-cell { padding: 4px; }
  .stat-value { font-size: 14px; }
  .chart { margin-bottom: 6px; }
  .chart-title { font-size: 11px; margin-bottom: 2px; }
  .chart-bars { height: 42px; }
  .chart-num { font-size: 10px; }
  .chart-wave { font-size: 9px; }
  .chart-fill-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; min-height: 0; }
  .feats-box, .last3-box, .build-box, .goal-box, .fors-box, .lifetime-box { margin-bottom: 6px; line-height: 1.4; }
  .feats-box { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; font-size: 12px; line-height: 1.3; }
  .feats-box, .last3-box, .build-box, .goal-box, .fors-box, .lifetime-box { margin-bottom: 6px; line-height: 1.4; }
  .feats-box { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .feats-title { grid-column: 1 / -1; }
  .fors-box { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .fors-title { grid-column: 1 / -1; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div id="toast"></div></div>
<div id="bottom"></div>
<div id="screen" class="screen"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
